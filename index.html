<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Michael Butler — Home</title>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/main.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <a class="home-link" href="index.html">HOME</a>
      </div>
      <div class="header-right">
        <nav class="top-nav" aria-label="Main navigation">
          <a class="nav-link" href="work.html">WORK</a>
          <a class="nav-link" href="about.html">ABOUT</a>
        </nav>
      </div>
    </div>
  </header>

<main class="feed" role="main">
</main>

<script>
fetch('content/home-projects.json')
  .then(res => res.json())
  .then(data => {
    const feed = document.querySelector('.feed');

    data.homePageLayout[0].projects.forEach(project => {
      const article = document.createElement('article');
      article.className = 'feed-item horizontal-full';

      const imgDiv = document.createElement('div');
      imgDiv.className = 'image-placeholder';
      imgDiv.style.backgroundImage = `url('${project.imageUrl}')`;
      imgDiv.setAttribute('aria-hidden', 'true');

      const caption = document.createElement('div');
      caption.className = 'caption';
      caption.innerHTML = `<h2 class="caption-title"><em>${project.title}</em>, ${project.year}. ${project.medium}.</h2>`;

      article.appendChild(imgDiv);
      article.appendChild(caption);
      feed.appendChild(article);
    });
  })
  .catch(err => console.error(err));
</script>
