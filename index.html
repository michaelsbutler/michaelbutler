<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Michael Butler — Home</title>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/main.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <a class="home-link" href="index.html">HOME</a>
      </div>
      <div class="header-right">
        <nav class="top-nav" aria-label="Main navigation">
          <a class="nav-link" href="work.html">WORK</a>
          <a class="nav-link" href="about.html">ABOUT</a>
        </nav>
      </div>
    </div>
  </header>

<main class="feed" role="main">
</main>

<script>
const feed = document.querySelector('.feed');

fetch('content/home-projects.json')
  .then(res => res.json())
  .then(data => {
    const projects = data.homePageLayout[0].projects;

    // Project 1 (full width)
    const project1 = projects[0];
    feed.innerHTML += `
      <article class="feed-item horizontal-full">
        <div class="image-placeholder" style="background-image: url('${project1.imageUrl}')"></div>
        <div class="caption">
          <h2 class="caption-title"><em>${project1.title}</em>, ${project1.year}. ${project1.medium}.</h2>
        </div>
      </article>
    `;

    // Projects 2 & 3 side by side
    feed.innerHTML += `
      <article class="feed-item horizontal-pair">
        <div class="side-by-side">
          ${projects.slice(1).map(p => `
            <div class="half-project">
              <img src="${p.imageUrl}" alt="${p.title}" class="half-image"/>
              <div class="caption">
                <h2 class="caption-title"><em>${p.title}</em>, ${p.year}. ${p.medium}.</h2>
              </div>
            </div>
          `).join('')}
        </div>
      </article>
    `;
  });
</script>
