<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Michael Butler — Home</title>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/main.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <a class="home-link" href="index.html">HOME</a>
      </div>
      <div class="header-right">
        <nav class="top-nav" aria-label="Main navigation">
          <a class="nav-link" href="work.html">WORK</a>
          <a class="nav-link" href="about.html">ABOUT</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="feed" role="main">
    <article class="feed-item">
      <div class="image-placeholder" style="background:#e5007d" aria-hidden="true"></div>
      <div class="caption">
       <h2 class="caption-title"><em>Design Project 1</em>, 2025</h2>
        <p class="caption-action"><a href="about.html" class="caption-link">Inquire</a></p>
      </div>
    </article>

    <article class="feed-item">
      <div class="image-placeholder" style="background:#00b0f0" aria-hidden="true"></div>
      <div class="caption">
        <h2 class="caption-title"><em>Design Project 2</em>, 2024</h2>
        <p class="caption-action"><a href="about.html" class="caption-link">Inquire</a></p>
      </div>
    </article>

    <article class="feed-item">
      <div class="image-placeholder" style="background:#2fb14a" aria-hidden="true"></div>
      <div class="caption">
        <h2 class="caption-title"><em>Design Project 3</em>, 2023</h2>
        <p class="caption-action"><a href="about.html" class="caption-link">Inquire</a></p>
      </div>
    </article>
  </main>

  <footer class="site-footer"></footer>
   <script>
  fetch('content/home-projects.json')
    .then(response => response.json())
    .then(data => {
      const feedElement = document.querySelector('.feed');
      data.homePageLayout.forEach(section => {
        section.projects.forEach(project => {
          const articleHTML = `
            <article class="feed-item horizontal-full">
              <div class="image-placeholder" style="background-image: url('${project.imageUrl}')" aria-hidden="true"></div>
              <div class="caption">
                <h2 class="caption-title"><em>${project.title}</em>, ${project.year}</h2>
                <p class="caption-action"><a href="about.html" class="caption-link">Inquire</a></p>
              </div>
            </article>
          `;
          feedElement.innerHTML += articleHTML;
        });
      });
    });
</script>

</body>
</html>
