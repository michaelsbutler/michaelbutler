<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Michael Butler — Home</title>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/main.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <a class="home-link" href="index.html">HOME</a>
      </div>
      <div class="header-right">
        <nav class="top-nav" aria-label="Main navigation">
          <a class="nav-link" href="work.html">WORK</a>
          <a class="nav-link" href="about.html">ABOUT</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="feed" role="main">
  
  </main>

  <footer class="site-footer"></footer>
<script>
fetch('content/home-projects.json')
  .then(response => response.json())
  .then(data => {
    const feedElement = document.querySelector('.feed');

    // Loop through sections in JSON
    data.homePageLayout.forEach(section => {

      // Loop through each project
      section.projects.forEach(project => {

        // Build the article HTML
        const articleHTML = `
          <article class="feed-item horizontal-full">

            <!-- Main image -->
            <div class="image-placeholder" style="background-image: url('${project.imageUrl}')" aria-hidden="true"></div>

            <!-- Caption -->
            <div class="caption">
              <h2 class="caption-title"><em>${project.title}</em>, ${project.year}. ${project.medium}.</h2>
            </div>
            
          </article>
        `;

        // Add the article to the page
        feedElement.innerHTML += articleHTML;

      });

    });
  })
  .catch(err => {
    console.error('Error loading home projects JSON:', err);
  });
</script>
