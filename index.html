<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Michael Butler — Home</title>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/main.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <a class="home-link" href="index.html">HOME</a>
      </div>
      <div class="header-right">
        <nav class="top-nav" aria-label="Main navigation">
          <a class="nav-link" href="work.html">WORK</a>
          <a class="nav-link" href="about.html">ABOUT</a>
        </nav>
      </div>
    </div>
  </header>

<main class="feed" role="main">
</main>

<script>
const feed = document.querySelector('.feed');

fetch('content/home-projects.json')
  .then(res => res.json())
  .then(data => {
    data.homePageLayout[0].projects.forEach(project => {
      feed.innerHTML += `
        <article class="feed-item horizontal-full">
          <div class="image-placeholder" style="background-image: url('${project.imageUrl}')"></div>
          <div class="caption">
            <h2 class="caption-title"><em>${project.title}</em>, ${project.year}. ${project.medium}.</h2>
          </div>
        </article>
      `;
    });
  })
  .catch(err => console.error('Error loading JSON:', err));
</script>
